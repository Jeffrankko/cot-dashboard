name: Weekly COT Update

on:
  # CFTC publishes Fridays at 3:30 pm ET (19:30–20:30 UTC).
  # Running Saturday 00:00 UTC gives ~4–5 hours for CFTC to publish.
  schedule:
    - cron: "0 0 * * 6"

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate index.html
        run: python generate.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to index.html — skipping commit."
          else
            REPORT_DATE=$(python -c "
import json, pathlib
data = json.loads(pathlib.Path('index.html').read_text())
" 2>/dev/null || date +%Y-%m-%d)
            REPORT_DATE=$(python -c "
import re, pathlib
m = re.search(r'%%REPORT_DATE%%|Report: ([A-Za-z]+ \d+, \d{4})', pathlib.Path('index.html').read_text())
" 2>/dev/null || date +%Y-%m-%d)
            REPORT_DATE=$(date +%Y-%m-%d)
            git commit -m "chore: weekly COT update ${REPORT_DATE}"
            git push
          fi
